---
- name: Install Argo CD on Kubernetes
  hosts: kube_control_plane[0]
  become: true
  gather_facts: false

  vars:
    argocd_release_name: argocd
    argocd_namespace: argocd
    argocd_repo_name: argo
    argocd_repo_url: https://argoproj.github.io/argo-helm
    argocd_chart: argo/argo-cd
    argocd_kubeconfig: /etc/kubernetes/admin.conf
    argocd_wait_timeout: 15m
    # Use ClusterIP with an Ingress, or override this with LoadBalancer when
    # the cluster has a load balancer implementation.
    argocd_server_service_type: NodePort
    # Pin in production with: -e argocd_chart_version=x.y.z
    argocd_chart_version: ""
    # GitOps bootstrap application
    argocd_application_name: homelab
    argocd_application_repo_url: https://github.com/seojelee9999/homelab-argocd
    argocd_application_revision: HEAD
    argocd_application_path: .
    argocd_application_destination_namespace: default
    argocd_application_manifest: /tmp/argocd-homelab-application.yml

  tasks:
    - name: Check that the Kubernetes admin kubeconfig exists
      ansible.builtin.stat:
        path: "{{ argocd_kubeconfig }}"
      register: argocd_kubeconfig_stat

    - name: Stop when the Kubernetes control plane is not initialized
      ansible.builtin.assert:
        that:
          - argocd_kubeconfig_stat.stat.exists
        fail_msg: >-
          {{ argocd_kubeconfig }} does not exist. Initialize the Kubernetes
          control plane before installing Argo CD.

    - name: Check required commands
      ansible.builtin.command:
        argv:
          - "{{ item }}"
          - version
          - --client
      loop:
        - kubectl
      changed_when: false

    - name: Check that Helm is installed
      ansible.builtin.command:
        argv:
          - helm
          - version
          - --short
      register: argocd_helm_version
      changed_when: false
      failed_when: false

    - name: Stop when Helm is not installed
      ansible.builtin.assert:
        that:
          - argocd_helm_version.rc == 0
        fail_msg: "Helm is required. Run 'ansible-playbook helm.yml' first."

    - name: Add or update the Argo Helm repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - "{{ argocd_repo_name }}"
          - "{{ argocd_repo_url }}"
          - --force-update
      register: argocd_repo_add
      changed_when: "'has been added' in argocd_repo_add.stdout"

    - name: Update Argo Helm repository metadata
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
          - "{{ argocd_repo_name }}"
      changed_when: false

    - name: Install or upgrade Argo CD
      ansible.builtin.command:
        argv: >-
          {{
            [
              'helm', 'upgrade', '--install', argocd_release_name,
              argocd_chart,
              '--namespace', argocd_namespace,
              '--create-namespace',
              '--set', 'server.service.type=' + argocd_server_service_type,
              '--wait', '--timeout', argocd_wait_timeout
            ]
            + (
              ['--version', argocd_chart_version]
              if argocd_chart_version | length > 0
              else []
            )
          }}
      environment:
        KUBECONFIG: "{{ argocd_kubeconfig }}"
      register: argocd_install
      changed_when: >-
        'has been upgraded' in argocd_install.stdout or
        'has been installed' in argocd_install.stdout

    - name: Create the homelab Argo CD Application manifest
      ansible.builtin.copy:
        dest: "{{ argocd_application_manifest }}"
        mode: "0600"
        content: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: {{ argocd_application_name }}
            namespace: {{ argocd_namespace }}
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: {{ argocd_application_repo_url }}
              targetRevision: {{ argocd_application_revision }}
              path: {{ argocd_application_path }}
            destination:
              server: https://kubernetes.default.svc
              namespace: {{ argocd_application_destination_namespace }}
            syncPolicy:
              automated:
                enabled: true
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true

    - name: Register the homelab repository with Argo CD
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ argocd_kubeconfig }}"
          - apply
          - --filename
          - "{{ argocd_application_manifest }}"
      register: argocd_application_apply
      changed_when: "'unchanged' not in argocd_application_apply.stdout"

    - name: Read the homelab Argo CD Application status
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ argocd_kubeconfig }}"
          - get
          - application
          - "{{ argocd_application_name }}"
          - --namespace
          - "{{ argocd_namespace }}"
          - --output=wide
      register: argocd_application_status
      changed_when: false

    - name: Show the homelab Argo CD Application status
      ansible.builtin.debug:
        var: argocd_application_status.stdout_lines

    - name: Read Argo CD server service information
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ argocd_kubeconfig }}"
          - get
          - service
          - "{{ argocd_release_name }}-server"
          - --namespace
          - "{{ argocd_namespace }}"
          - --output=wide
      register: argocd_server_service
      changed_when: false

    - name: Show Argo CD connection information
      ansible.builtin.debug:
        msg:
          - "{{ argocd_server_service.stdout }}"
          - >-
            Initial admin password:
            kubectl -n {{ argocd_namespace }} get secret
            {{ argocd_release_name }}-initial-admin-secret
            -o jsonpath='{.data.password}' | base64 -d; echo
