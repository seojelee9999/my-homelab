---
- name: Deploy Argo CD on Kubernetes worker nodes
  hosts: kube_control_plane[0]
  become: true
  gather_facts: false

  vars_files:
    - deploy-vault.yaml

  vars:
    argocd_release_name: argocd
    argocd_namespace: argocd
    argocd_chart_ref: argo/argo-cd
    argocd_chart_version: ""
    argocd_repo_name: argo
    argocd_repo_url: https://argoproj.github.io/argo-helm
    argocd_kubeconfig: /etc/kubernetes/admin.conf
    argocd_wait_timeout: 900s
    argocd_server_service_type: NodePort

    # Schedule every Argo CD component only on nodes labelled as workers.
    argocd_helm_values:
      global:
        nodeSelector:
          node-role.kubernetes.io/worker: ""
      server:
        service:
          type: "{{ argocd_server_service_type }}"

    argocd_application_name: homelab-root
    argocd_application_repo_url: https://github.com/seojelee9999/homelab-argocd.git
    argocd_application_revision: main
    argocd_application_path: argocd
    argocd_application_destination_namespace: "{{ argocd_namespace }}"
    argocd_cluster_resources_application_name: cluster-resources
    argocd_cluster_resources_path: cluster-resources
    argocd_cluster_resources_destination_namespace: default
    # Reuse the same PAT for the root repository and private application repos.
    argocd_repository_secret_name: github-seojelee9999-repo-creds
    argocd_repository_url_prefix: https://github.com/seojelee9999/
    argocd_repository_username: seojelee9999

  pre_tasks:
    - name: Verify vault_argocd_repository_pat is set in deploy-vault.yaml
      ansible.builtin.assert:
        that:
          - vault_argocd_repository_pat | default('') | trim | length > 0
        fail_msg: Define vault_argocd_repository_pat in deploy-vault.yaml using Ansible Vault.
      no_log: true

    - name: Install Python dependencies for Kubernetes modules
      ansible.builtin.apt:
        name:
          - python3-kubernetes
          - python3-yaml
          - python3-jsonpatch
        state: present
        update_cache: true

    - name: Check that the Kubernetes admin kubeconfig exists
      ansible.builtin.stat:
        path: "{{ argocd_kubeconfig }}"
      register: argocd_kubeconfig_stat

    - name: Verify deployment prerequisites
      ansible.builtin.assert:
        that:
          - argocd_kubeconfig_stat.stat.exists
        fail_msg: >-
          {{ argocd_kubeconfig }} does not exist. Initialize the control plane
          before deploying Argo CD.

  tasks:
    - name: Add the Argo Helm repository
      kubernetes.core.helm_repository:
        name: "{{ argocd_repo_name }}"
        repo_url: "{{ argocd_repo_url }}"
        force_update: true

    - name: Create the Argo CD namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ argocd_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ argocd_namespace }}"

    - name: Label Kubernetes worker nodes
      kubernetes.core.k8s:
        kubeconfig: "{{ argocd_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Node
          metadata:
            name: "{{ hostvars[item].ansible_hostname | default(item) }}"
            labels:
              node-role.kubernetes.io/worker: ""
      loop: "{{ groups['kube_node'] }}"

    - name: Install or upgrade Argo CD with Helm
      kubernetes.core.helm:
        kubeconfig: "{{ argocd_kubeconfig }}"
        name: "{{ argocd_release_name }}"
        chart_ref: "{{ argocd_chart_ref }}"
        chart_version: "{{ argocd_chart_version if argocd_chart_version | length > 0 else omit }}"
        release_namespace: "{{ argocd_namespace }}"
        create_namespace: false
        release_values: "{{ argocd_helm_values }}"
        update_repo_cache: true
        wait: true
        wait_timeout: "{{ argocd_wait_timeout }}"
        atomic: true

    - name: Register shared GitHub PAT credentials in Argo CD
      kubernetes.core.k8s:
        kubeconfig: "{{ argocd_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ argocd_repository_secret_name }}"
            namespace: "{{ argocd_namespace }}"
            labels:
              argocd.argoproj.io/secret-type: repo-creds
          type: Opaque
          stringData:
            type: git
            url: "{{ argocd_repository_url_prefix }}"
            username: "{{ argocd_repository_username }}"
            password: "{{ vault_argocd_repository_pat }}"
      no_log: true
      diff: false

    - name: Create the homelab root Argo CD application
      kubernetes.core.k8s:
        kubeconfig: "{{ argocd_kubeconfig }}"
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: "{{ argocd_application_name }}"
            namespace: "{{ argocd_namespace }}"
          spec:
            project: default
            source:
              repoURL: "{{ argocd_application_repo_url }}"
              targetRevision: "{{ argocd_application_revision }}"
              path: "{{ argocd_application_path }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ argocd_application_destination_namespace }}"
            syncPolicy:
              automated:
                enabled: true
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true

    - name: Create the cluster resources Argo CD application
      kubernetes.core.k8s:
        kubeconfig: "{{ argocd_kubeconfig }}"
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: "{{ argocd_cluster_resources_application_name }}"
            namespace: "{{ argocd_namespace }}"
          spec:
            project: default
            source:
              repoURL: "{{ argocd_application_repo_url }}"
              targetRevision: "{{ argocd_application_revision }}"
              path: "{{ argocd_cluster_resources_path }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ argocd_cluster_resources_destination_namespace }}"
            syncPolicy:
              automated:
                enabled: true
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true

    - name: Read the Argo CD server service
      kubernetes.core.k8s_info:
        kubeconfig: "{{ argocd_kubeconfig }}"
        api_version: v1
        kind: Service
        name: "{{ argocd_release_name }}-server"
        namespace: "{{ argocd_namespace }}"
      register: argocd_server_service

    - name: Show Argo CD connection information
      ansible.builtin.debug:
        msg:
          - >-
            Service type: {{ argocd_server_service.resources[0].spec.type }}
          - >-
            Initial password: kubectl -n {{ argocd_namespace }} get secret
            {{ argocd_release_name }}-initial-admin-secret
            -o jsonpath='{.data.password}' | base64 -d; echo
