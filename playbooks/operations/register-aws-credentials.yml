---
- name: Register AWS credentials for ESO on the control plane
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    aws_credentials_file: "/home/{{ ansible_user | default('ubuntu') }}/.aws/credentials"
    aws_profile: homelab-eso
    kubeconfig_file: /etc/kubernetes/admin.conf
    kubectl_binary: kubectl
    aws_secret_namespace: external-secrets
    aws_secret_name: aws-ssm-credentials
    eso_credentials: "{{ eso_credentials_result.stdout | from_json }}"
    eso_secret_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ aws_secret_name }}"
        namespace: "{{ aws_secret_namespace }}"
      type: Opaque
      data:
        access-key-id: "{{ eso_credentials.access_key | b64encode }}"
        secret-access-key: "{{ eso_credentials.secret_key | b64encode }}"

  tasks:
    - name: Read and register credentials without logging secret values
      no_log: true
      block:
        - name: Read the AWS credentials profile on the control plane
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import configparser
                import json
                import os
                import sys

                config = configparser.ConfigParser(interpolation=None)
                with open(os.path.expanduser(sys.argv[1])) as credentials:
                    config.read_file(credentials)
                profile = config[sys.argv[2]]
                print(json.dumps({
                    "access_key": profile.get("aws_access_key_id", "").strip(),
                    "secret_key": profile.get("aws_secret_access_key", "").strip(),
                    "session_token": profile.get("aws_session_token", "").strip(),
                }))
              - "{{ aws_credentials_file }}"
              - "{{ aws_profile }}"
          register: eso_credentials_result
          changed_when: false
          check_mode: false

        - name: Require an access key and secret key without a session token
          ansible.builtin.assert:
            that:
              - eso_credentials.access_key | length > 0
              - eso_credentials.secret_key | length > 0
              - not eso_credentials.access_key.startswith('ASIA')
              - eso_credentials.session_token | length == 0

        - name: Read the current Secret for an idempotent update
          ansible.builtin.command:
            argv:
              - "{{ kubectl_binary }}"
              - --kubeconfig
              - "{{ kubeconfig_file }}"
              - --request-timeout=15s
              - -n
              - "{{ aws_secret_namespace }}"
              - get
              - secret
              - "{{ aws_secret_name }}"
              - --ignore-not-found=true
              - -o
              - json
          register: eso_current_secret
          changed_when: false
          check_mode: false

        - name: Determine whether credentials need updating
          ansible.builtin.set_fact:
            eso_needs_update: >-
              {{ (eso_current_secret.stdout | default('{}', true) | from_json).get('type') != 'Opaque'
                 or (eso_current_secret.stdout | default('{}', true) | from_json).get('data', {}).get('access-key-id') != eso_secret_definition.data['access-key-id']
                 or (eso_current_secret.stdout | default('{}', true) | from_json).get('data', {}).get('secret-access-key') != eso_secret_definition.data['secret-access-key'] }}
            cacheable: false

        - name: Apply credentials through stdin
          ansible.builtin.command:
            argv:
              - "{{ kubectl_binary }}"
              - --kubeconfig
              - "{{ kubeconfig_file }}"
              - --request-timeout=15s
              - apply
              - --server-side
              - --field-manager=manual-aws-credentials
              - -f
              - '-'
              - -o
              - name
            stdin: "{{ eso_secret_definition | to_json }}"
          when: eso_needs_update and not ansible_check_mode
          changed_when: true
          diff: false

      rescue:
        - name: Report a redacted registration failure
          ansible.builtin.fail:
            msg: >-
              AWS Secret registration failed. Check the control-plane credentials file, named INI profile,
              access key and secret key, kubeconfig permissions, and existing Secret field ownership or immutability.
              Raw errors are hidden to protect credentials. No ownership conflicts are forced.

    - name: Report the target without exposing credentials
      ansible.builtin.debug:
        msg: >-
          {{ aws_secret_namespace }}/{{ aws_secret_name }}:
          {{ 'would be created/updated' if ansible_check_mode and eso_needs_update
             else ('created/updated' if eso_needs_update else 'already matches') }}
      changed_when: ansible_check_mode and eso_needs_update
