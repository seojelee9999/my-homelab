---
- name: Register private GHCR image pull access
  hosts: kube_control_plane[0]
  become: true
  gather_facts: false
  vars:
    diet_ghcr_username: seojelee9999
  vars_prompt:
    - name: diet_ghcr_token
      prompt: "GitHub PAT (classic), read:packages only, for private GHCR image pulls"
      private: true
  tasks:
    - name: Require a token without printing it
      ansible.builtin.assert:
        that:
          - diet_ghcr_token | default('') | trim | length > 0
        fail_msg: "Provide the read:packages token at the hidden prompt."
      no_log: true
    - name: Store the registry credential only in the cluster
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ghcr-pull
            namespace: diet-app
          type: kubernetes.io/dockerconfigjson
          stringData:
            .dockerconfigjson: >-
              {{ {'auths': {'ghcr.io': {'auth': (diet_ghcr_username ~ ':' ~ diet_ghcr_token) | b64encode}}} | to_json }}
      no_log: true
