---
- name: Register GHCR image pull secrets in namespaces
  hosts: kube_control_plane[0]
  become: true
  gather_facts: false
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    ghcr_username: seojelee9999
    ghcr_secret_name: ghcr-pull
    ghcr_namespaces:
      - diet-app
  vars_files:
    - ghcr-pat-vault.yaml
  tasks:
    - name: Require GHCR credentials without printing them
      ansible.builtin.assert:
        that:
          - ghcr_username | default('') | trim | length > 0
          - ghcr_token | default('') | trim | length > 0
        fail_msg: "Provide ghcr_username and set ghcr_token in ghcr-pat-vault.yaml."
      no_log: true

    - name: Ensure target namespaces exist
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
      loop: "{{ ghcr_namespaces }}"

    - name: Register the GHCR image pull secret in each namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ ghcr_secret_name }}"
            namespace: "{{ item }}"
          type: kubernetes.io/dockerconfigjson
          stringData:
            .dockerconfigjson: >-
              {{ {'auths': {'ghcr.io': {'auth': (ghcr_username ~ ':' ~ ghcr_token) | b64encode}}} | to_json }}
      loop: "{{ ghcr_namespaces }}"
      no_log: true
